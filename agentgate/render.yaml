services:
  - type: web
    name: agentgate
    runtime: docker
    rootDir: agentgate
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SELF_KEEPALIVE_ENABLED
        value: "true"
      - key: SELF_KEEPALIVE_INTERVAL_SEC
        value: "25"
      - key: LLM_ENABLED
        value: "true"
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
